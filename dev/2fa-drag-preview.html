<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2FA 卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/sidepanel.css">
<style>
    body {
        width: 420px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-2fa" class="view-content">
    <div id="fa-list" class="fa-list"></div>
    <div id="fa-empty" class="empty-state hidden"><p>暂无2FA账号</p></div>
</div>

<div id="test-log"></div>

<script src="../js/utils.js"></script>
<script>
    // 最小宿主垫片：sp-2fa.js 依赖的全局
    window.__saved2fa = null;
    window.__saveCount = 0;
    let faRefreshIntervals = {};
    let faAutoFetch = false;
    let my2faAccounts = [
        { id: 101, name: '账号 A', key: 'JBSWY3DPEHPK3PXP' },
        { id: 102, name: '账号 B', key: 'JBSWY3DPEHPK3PXQ' },
        { id: 103, name: '账号 C', key: 'JBSWY3DPEHPK3PXR' },
        { id: 104, name: '账号 D', key: 'JBSWY3DPEHPK3PXS' },
        { id: 105, name: '账号 E', key: 'JBSWY3DPEHPK3PXT' }
    ];
    const faList = document.getElementById('fa-list');
    const faEmpty = document.getElementById('fa-empty');
    const meowI18n = { t: k => k };
    function saveData() {
        window.__saveCount++;
        window.__saved2fa = JSON.parse(JSON.stringify(my2faAccounts));
    }
    function showToast() {}
    function showConfirmDialog() { return Promise.resolve(true); }
</script>
<script src="../js/modules/sp-2fa.js"></script>
<script>
(function () {
    const container = document.getElementById('fa-list');
    const logEl = document.getElementById('test-log');
    const lines = [];

    function log(text) {
        lines.push(text);
        logEl.textContent = lines.join('\n');
    }

    function ids() {
        return Array.from(container.querySelectorAll('.fa-card')).map(c => c.dataset.id);
    }

    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) window.__failed = (window.__failed || 0) + 1;
    }

    render2FA();

    check('卡片渲染完成（5 张）', container.querySelectorAll('.fa-card').length === 5,
        String(container.querySelectorAll('.fa-card').length));
    check('只有标题栏是拖拽手柄，卡片本体不 draggable',
        !container.querySelector('.fa-card[draggable="true"]') &&
        Array.from(container.querySelectorAll('.fa-card-header')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张卡片都有 grip 手柄',
        Array.from(container.querySelectorAll('.fa-card-header')).every(h => !!h.querySelector('.fa-card-drag-handle')));

    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;

    function startDrag(id) {
        const card = container.querySelector('[data-id="' + id + '"]');
        const header = card.querySelector('.fa-card-header');
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 70;
        grabY = rect.top + 12;
        header.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
    }

    function moveTo(targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            container.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true,
                clientX: grabX, clientY: y,
                dataTransfer: dt
            }));
        }
        grabY = targetY;
    }

    function dropNow() {
        container.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
        container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    // ===== 用例 1：把第一张一路拖到末尾 =====
    startDrag('101');

    const ph1 = container.querySelector('.fa-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1);
    check('占位块紧邻原位置（101 之后）', ph1 && ph1.nextElementSibling && ph1.nextElementSibling.dataset.id === '101');
    check('被拖卡片进入 fixed 跟随', container.querySelector('[data-id="101"]').classList.contains('dragging-follow'));

    const beforeTops = new Map();
    Array.from(container.querySelectorAll('.fa-card')).forEach(c => {
        if (c.dataset.id !== '101') beforeTops.set(c.dataset.id, c.offsetTop);
    });

    const lastRect = container.querySelector('[data-id="105"]').getBoundingClientRect();
    moveTo(lastRect.bottom - 4);

    const ph2 = container.querySelector('.fa-drop-placeholder');
    check('占位块已下移到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.id : 'null'));

    const movedIds = Array.from(container.querySelectorAll('.fa-card')).filter(c => {
        const id = c.dataset.id;
        if (id === '101') return false;
        return c.offsetTop !== beforeTops.get(id);
    }).map(c => c.dataset.id);
    check('其它卡片被让位推动（offsetTop 改变）', movedIds.join(',') === '102,103,104,105', '改变: ' + movedIds.join(','));

    const phHeight = ph2 ? parseFloat(ph2.style.height) : 0;
    const cardHeight = container.querySelector('[data-id="101"]').getBoundingClientRect().height;
    check('占位块高度与被拖卡片一致', Math.abs(phHeight - cardHeight) < 1.5, phHeight.toFixed(1) + ' vs ' + cardHeight.toFixed(1));

    const savesBefore = window.__saveCount;
    dropNow();
    check('放下后顺序为 102,103,104,105,101', ids().join(',') === '102,103,104,105,101', ids().join(','));
    check('放下后占位块已移除', !container.querySelector('.fa-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !container.querySelector('.dragging-follow') &&
        !Array.from(container.querySelectorAll('.fa-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('索引重排为 0..4',
        Array.from(container.querySelectorAll('.fa-card')).every((c, i) => c.dataset.index === String(i)));
    check('数据层顺序同步为 102,103,104,105,101',
        (window.__saved2fa || []).map(a => a.id).join(',') === '102,103,104,105,101',
        (window.__saved2fa || []).map(a => a.id).join(','));
    check('顺序变化时写了一次存储', window.__saveCount === savesBefore + 1,
        String(window.__saveCount - savesBefore));

    // ===== 用例 2：往回拖（验证上移方向） =====
    startDrag('101');
    const secondEl = container.querySelector('[data-id="102"]');
    moveTo(container.getBoundingClientRect().top + secondEl.offsetTop + 6);
    const ph3 = container.querySelector('.fa-drop-placeholder');
    check('上拖时占位块移到最前', ph3 && !ph3.previousElementSibling);
    dropNow();
    check('上拖放下后 101 回到首位', ids()[0] === '101', ids().join(','));

    // ===== 用例 3：原地放下不写存储 =====
    const savesBefore2 = window.__saveCount;
    startDrag('102');
    const origRect = container.querySelector('[data-id="102"]').getBoundingClientRect();
    moveTo(origRect.top + 4);
    dropNow();
    check('原地放下顺序不变', ids().join(',') === '101,102,103,104,105', ids().join(','));
    check('原地放下不写存储', window.__saveCount === savesBefore2,
        String(window.__saveCount - savesBefore2));

    // ===== 用例 4：只有标题栏起拖；内容区拖拽被忽略 =====
    const cardC = container.querySelector('[data-id="104"]');
    const before2 = ids().join(',');
    cardC.querySelector('.fa-card-key').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    cardC.querySelector('.fa-code-row').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('内容区拖拽不触发卡片排序', !container.querySelector('.fa-drop-placeholder') && ids().join(',') === before2);

    // ===== 用例 5：拖到区域外松手应取消 =====
    startDrag('104');
    const before3 = ids().join(',');
    moveTo(container.querySelector('[data-id="105"]').getBoundingClientRect().bottom - 2);
    container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids().join(',') === before3, before3 + ' → ' + ids().join(','));
    check('取消后无占位块残留', !container.querySelector('.fa-drop-placeholder'));

    window.__done = true;
})();
</script>
</body>
</html>
