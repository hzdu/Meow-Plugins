<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI Provider 卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/sidepanel.css">
<style>
    body {
        width: 420px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-ai-provider" class="view-content">
    <div class="gallery-controls" id="ai-provider-controls">
        <input type="text" id="ai-provider-filter-input" class="ai-filter-input" value="" style="width:100%;padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;box-sizing:border-box;">
    </div>
    <div id="ai-provider-list" class="fa-list"></div>
    <div id="ai-provider-empty" class="empty-state hidden">
        <p>暂无数据</p>
    </div>
</div>

<div id="test-log"></div>

<script>
    // 最小 chrome API 垫片 + 存储记录，供 sp-ai-provider.js 在普通网页中运行。
    // Edge/Chrome 自带 window.chrome（但没有 storage），直接赋值会沿用原生对象，
    // 所以这里显式重建 storage 垫片。
    window.__savedProviders = null;
    window.chrome = {
        storage: {
            local: {
                get: (keys, cb) => cb && cb({}),
                set: (obj, cb) => {
                    if (obj && obj.meow_ai_providers) window.__savedProviders = obj.meow_ai_providers;
                    cb && cb();
                }
            },
            sync: { get: (k, cb) => cb && cb({}), set: (o, cb) => cb && cb() },
            onChanged: { addListener: () => {} }
        },
        runtime: { sendMessage: () => {} }
    };
</script>
<script src="../js/utils.js"></script>
<script>
    // sp-core.js 在真实环境里声明的全局，这里用最小集替代
    let myAiProviders = [];
    let aiDragSrcIndex = null;
    let editingAiId = null;
    const aiProviderList = document.getElementById('ai-provider-list');
    const aiProviderEmpty = document.getElementById('ai-provider-empty');
    const aiProviderFilterInput = document.getElementById('ai-provider-filter-input');

    // utils.js 未覆盖的交互函数，预览里置空即可
    function copyToClipboard() {}
    function showToast() {}
    function showConfirmDialog() { return Promise.resolve(false); }
</script>
<script src="../js/modules/sp-ai-provider.js"></script>
<script>
// 宿主的 AI Provider 数据：含一个会被筛选隐藏的 D（模型不含 m1）
myAiProviders = [
    { id: 'a1', title: 'Alpha',   models: ['m1'] },
    { id: 'b1', title: 'Beta',    models: ['m1'] },
    { id: 'c1', title: 'Gamma',   models: ['m1'] },
    { id: 'd1', title: 'Delta',   models: ['qxx'] },
    { id: 'e1', title: 'Epsilon', models: ['m1'] }
];
// 打开筛选，让 D 被隐藏（display:none）
aiProviderFilterInput.value = 'm1';
renderAIProviders();

(function () {
    const container = aiProviderList;
    const logEl = document.getElementById('test-log');
    const lines = [];

    function log(text) {
        lines.push(text);
        logEl.textContent = lines.join('\n');
    }

    function ids(all) {
        return Array.from(container.querySelectorAll('.ai-card'))
            .filter(c => all || c.style.display !== 'none')
            .map(c => c.dataset.id);
    }

    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) window.__failed = (window.__failed || 0) + 1;
    }

    // ---- 模拟一次拖拽：按真实指针轨迹分步派发 dragover ----
    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;

    function startDrag(id) {
        const card = container.querySelector('[data-id="' + id + '"]');
        const header = card.querySelector('.ai-card-header');
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 70;
        grabY = rect.top + 12;
        header.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
    }

    function moveTo(targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            container.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true,
                clientX: grabX, clientY: y,
                dataTransfer: dt
            }));
        }
        grabY = targetY;
    }

    function dropNow() {
        container.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
        container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    // ===== 用例 0：渲染后的基础状态 =====
    check('只有标题栏是拖拽手柄，卡片本体不 draggable',
        !container.querySelector('.ai-card[draggable="true"]') &&
        Array.from(container.querySelectorAll('.ai-card-header')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张卡片标题栏都有 grip 手柄',
        Array.from(container.querySelectorAll('.ai-card-header')).every(h => h.querySelector('.ai-card-drag-handle')));
    check('被筛选卡片处于隐藏状态', container.querySelector('[data-id="d1"]').style.display === 'none');

    // ===== 用例 1：把 A 一路拖到可视末尾（跳过隐藏的 D） =====
    startDrag('a1');

    const ph1 = container.querySelector('.ai-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1);
    check('占位块紧邻原位置（A 之后）', ph1 && ph1.nextElementSibling && ph1.nextElementSibling.dataset.id === 'a1');
    check('被拖卡片进入 fixed 跟随', container.querySelector('[data-id="a1"]').classList.contains('dragging-follow'));

    const beforeTops = new Map();
    Array.from(container.querySelectorAll('.ai-card')).forEach(c => {
        if (c.dataset.id !== 'a1') beforeTops.set(c.dataset.id, c.offsetTop);
    });

    const eRect = container.querySelector('[data-id="e1"]').getBoundingClientRect();
    moveTo(eRect.bottom - 4);

    const ph2 = container.querySelector('.ai-drop-placeholder');
    check('占位块已下移到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.id : 'null'));

    // 被拖卡片从首位拖到末尾：它原来占的高度塌陷，中间/末尾的可见卡片（b、c、e）
    // 都会上移；隐藏的 D 不参与。
    const movedIds = Array.from(container.querySelectorAll('.ai-card')).filter(c => {
        const id = c.dataset.id;
        if (id === 'a1' || c.style.display === 'none') return false;
        return c.offsetTop !== beforeTops.get(id);
    }).map(c => c.dataset.id);
    check('其它可见卡片被让位推动（offsetTop 改变）', movedIds.join(',') === 'b1,c1,e1', '改变: ' + movedIds.join(','));

    const phHeight = ph2 ? parseFloat(ph2.style.height) : 0;
    const aHeight = container.querySelector('[data-id="a1"]').getBoundingClientRect().height;
    check('占位块高度与被拖卡片一致', Math.abs(phHeight - aHeight) < 1.5, phHeight.toFixed(1) + ' vs ' + aHeight.toFixed(1));

    dropNow();
    check('放下后可见顺序为 b,c,e,a', ids().join(',') === 'b1,c1,e1,a1', ids().join(','));
    check('放下后占位块已移除', !container.querySelector('.ai-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !container.querySelector('.dragging-follow') &&
        !Array.from(container.querySelectorAll('.ai-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('放下后索引重排为 0..4',
        Array.from(container.querySelectorAll('.ai-card')).every((c, i) => c.dataset.index === String(i)));

    // 隐藏卡片位置不变：数据层 D 仍在第 4 位
    const saved1 = window.__savedProviders || myAiProviders;
    check('数据层只重排可见项，隐藏的 D 保持原位',
        saved1.map(p => p.id).join(',') === 'b1,c1,e1,d1,a1',
        saved1.map(p => p.id).join(','));

    // ===== 用例 2：往回拖（验证上移方向） =====
    startDrag('a1');
    const bEl = container.querySelector('[data-id="b1"]');
    moveTo(container.getBoundingClientRect().top + bEl.offsetTop + 6);
    const ph3 = container.querySelector('.ai-drop-placeholder');
    check('上拖时占位块移到最前', ph3 && !ph3.previousElementSibling);
    dropNow();
    check('上拖放下后 A 回到首位', ids()[0] === 'a1', ids().join(','));

    // ===== 用例 3：只有标题栏起拖；内容区拖拽被忽略 =====
    const cardC = container.querySelector('[data-id="c1"]');
    const bodyC = cardC.querySelector('.ai-card-body');
    const before2 = ids(true).join(',');
    bodyC.dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('内容区拖拽不触发卡片排序', !container.querySelector('.ai-drop-placeholder') && ids(true).join(',') === before2);

    // ===== 用例 4：拖到区域外松手应取消 =====
    startDrag('c1');
    const before3 = ids().join(',');
    moveTo(container.querySelector('[data-id="e1"]').getBoundingClientRect().bottom - 2);
    container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids().join(',') === before3, before3 + ' → ' + ids().join(','));
    check('取消后无占位块残留', !container.querySelector('.ai-drop-placeholder'));

    window.__done = true;
})();
</script>
</body>
</html>
