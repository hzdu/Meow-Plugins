<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弹出窗口 2FA 卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/popup.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
    body {
        width: 380px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-2fa">
    <div class="popup-exchange-panel">
        <div id="fa-list" class="q-list"></div>
        <div id="fa-empty" class="empty-state hidden"><p>暂无2FA账号</p></div>
    </div>
</div>

<div id="test-log"></div>

<script src="../js/utils.js"></script>
<script>
    // 最小宿主垫片：popup-2fa.js 依赖的全局（与 popup-core.js 同名）
    let my2faAccounts = [
        { id: 101, name: '账号 A', key: 'JBSWY3DPEHPK3PXP' },
        { id: 102, name: '账号 B', key: 'JBSWY3DPEHPK3PXQ' },
        { id: 103, name: '账号 C', key: 'JBSWY3DPEHPK3PXR' },
        { id: 104, name: '账号 D', key: 'JBSWY3DPEHPK3PXS' },
        { id: 105, name: '账号 E', key: 'JBSWY3DPEHPK3PXT' }
    ];
    let faRefreshIntervals = {};
    let faAutoFetch = false;
    let faComputeMode = 'cloud';
    let editing2faId = null;

    const faList = document.getElementById('fa-list');
    const faEmpty = document.getElementById('fa-empty');
    const meowI18n = { t: k => k };
    function showToast() {}
    function showConfirmDialog() { return Promise.resolve(true); }
    function copyToClipboard() {}
</script>
<script src="../js/modules/card-drag.js"></script>
<script src="../js/modules/popup-2fa.js"></script>
<script>
(function () {
    // 拦截落盘：记录保存次数与快照，不依赖 chrome.storage
    window.__saveCount = 0;
    window.__saved2fa = null;
    save2FA = function () {
        window.__saveCount++;
        window.__saved2fa = my2faAccounts.map(a => a.id);
    };

    // 关掉计时器，避免后台 setInterval 干扰
    function stopTimers() {
        Object.keys(faRefreshIntervals).forEach(k => { clearInterval(faRefreshIntervals[k]); clearTimeout(faRefreshIntervals[k]); });
        faRefreshIntervals = {};
    }

    const logEl = document.getElementById('test-log');
    const lines = [];
    let failed = 0;
    function log(text) { lines.push(text); logEl.textContent = lines.join('\n'); }
    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) failed++;
    }
    function ids() {
        return Array.from(faList.querySelectorAll('.fa-card')).map(c => c.dataset.id).join(',');
    }

    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;

    function startDrag(id) {
        const card = faList.querySelector('[data-id="' + id + '"]');
        const header = card.querySelector('.fa-card-header');
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 70;
        grabY = rect.top + 12;
        header.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true, clientX: grabX, clientY: grabY, dataTransfer: dt
        }));
        return card;
    }
    function moveTo(targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            faList.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true, clientX: grabX, clientY: y, dataTransfer: dt
            }));
        }
        grabY = targetY;
    }
    function dropNow() {
        faList.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true, clientX: grabX, clientY: grabY, dataTransfer: dt
        }));
        faList.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    render2FA();
    stopTimers();

    check('卡片渲染完成（5 张）', faList.querySelectorAll('.fa-card').length === 5,
        String(faList.querySelectorAll('.fa-card').length));
    check('只有标题栏是拖拽手柄，卡片本体不 draggable',
        !faList.querySelector('.fa-card[draggable="true"]') &&
        Array.from(faList.querySelectorAll('.fa-card-header')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张卡片都有 Material 图标 grip 手柄',
        Array.from(faList.querySelectorAll('.fa-card-header')).every(h => {
            const g = h.firstElementChild;
            return g && g.classList.contains('fa-card-drag-handle') && g.classList.contains('material-icons') && g.textContent === 'drag_indicator';
        }));
    check('#fa-list 是定位容器（落点判断依赖 offsetTop）',
        faList.querySelector('.fa-card').offsetParent === faList);

    // ===== 用例 1：第一张拖到末尾 =====
    const firstCard = startDrag('101');
    const ph1 = faList.querySelector('.fa-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1 && ph1.previousElementSibling === null);
    check('被拖卡片进入 fixed 跟随', firstCard.classList.contains('dragging-follow'));
    check('卡片本体没有 draggable 属性', !firstCard.hasAttribute('draggable'));

    const card2TopBefore = faList.querySelector('[data-id="102"]').offsetTop;
    const phTop = ph1 ? ph1.offsetTop : -1;
    const phH = ph1 ? ph1.offsetHeight : 0;
    const cardH = firstCard.getBoundingClientRect().height;
    check('占位块高度与被拖卡片一致', Math.abs(phH - cardH) < 1.5, phH.toFixed(1) + ' vs ' + cardH.toFixed(1));
    check('占位块接下卡片原来的间距（卡片不跳位）',
        Math.abs(faList.querySelector('[data-id="102"]').offsetTop - card2TopBefore) < 0.5,
        '卡2 offsetTop ' + card2TopBefore + ' → ' + faList.querySelector('[data-id="102"]').offsetTop +
        '（占位块 offsetTop=' + phTop + '）');

    const beforeTops = new Map();
    Array.from(faList.querySelectorAll('.fa-card')).forEach(c => {
        if (c.dataset.id !== '101') beforeTops.set(c.dataset.id, c.offsetTop);
    });
    moveTo(faList.querySelector('[data-id="105"]').getBoundingClientRect().bottom - 4);

    const ph2 = faList.querySelector('.fa-drop-placeholder');
    check('占位块已下移到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.id : 'null'));
    const moved = Array.from(faList.querySelectorAll('.fa-card')).filter(c => {
        if (c.dataset.id === '101') return false;
        return c.offsetTop !== beforeTops.get(c.dataset.id);
    }).map(c => c.dataset.id);
    check('其它卡片被让位推动', moved.join(',') === '102,103,104,105', '改变: ' + moved.join(','));

    const saves1 = window.__saveCount;
    dropNow();
    stopTimers();
    check('放下后顺序为 102,103,104,105,101', ids() === '102,103,104,105,101', ids());
    check('放下后占位块已移除', !faList.querySelector('.fa-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !faList.querySelector('.dragging-follow') &&
        !Array.from(faList.querySelectorAll('.fa-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('数据层顺序同步为 102,103,104,105,101',
        (window.__saved2fa || []).join(',') === '102,103,104,105,101', (window.__saved2fa || []).join(','));
    check('顺序变化时写了一次存储', window.__saveCount === saves1 + 1, String(window.__saveCount - saves1));
    check('重渲染后仍带 grip 手柄',
        Array.from(faList.querySelectorAll('.fa-card-header')).every(h => !!h.querySelector('.fa-card-drag-handle')));
    check('索引重排为 0..4',
        Array.from(faList.querySelectorAll('.fa-card')).every((c, i) => c.dataset.index === String(i)));

    // ===== 用例 2：往回拖（验证上移方向） =====
    startDrag('101');
    const secondEl = faList.querySelector('[data-id="102"]');
    moveTo(faList.getBoundingClientRect().top + secondEl.offsetTop + 6);
    check('上拖时占位块移到最前', (function () {
        const ph = faList.querySelector('.fa-drop-placeholder');
        return ph && !ph.previousElementSibling;
    })());
    dropNow();
    stopTimers();
    check('上拖放下后 101 回到首位', ids().split(',')[0] === '101', ids());

    // ===== 用例 3：原地放下不写存储 =====
    const saves2 = window.__saveCount;
    startDrag('102');
    const r2 = faList.querySelector('[data-id="102"]').getBoundingClientRect();
    moveTo(r2.top + 4);
    dropNow();
    stopTimers();
    check('原地放下顺序不变', ids() === '101,102,103,104,105', ids());
    check('原地放下不写存储', window.__saveCount === saves2, String(window.__saveCount - saves2));

    // ===== 用例 4：内容区 / 操作按钮起拖被忽略 =====
    const card3 = faList.querySelector('[data-id="103"]');
    const beforeIds = ids();
    card3.querySelector('.fa-code-row').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    card3.querySelector('.fa-refresh-btn').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('验证码区/操作按钮起拖不触发排序',
        !faList.querySelector('.fa-drop-placeholder') && ids() === beforeIds);

    // ===== 用例 5：拖到区域外松手应取消 =====
    startDrag('104');
    const beforeCancel = ids();
    moveTo(faList.querySelector('[data-id="105"]').getBoundingClientRect().bottom - 2);
    faList.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids() === beforeCancel, beforeCancel + ' → ' + ids());
    check('取消后无占位块残留', !faList.querySelector('.fa-drop-placeholder'));

    // ===== 用例 6：清空后仍可重新渲染并挂上手柄 =====
    my2faAccounts = [];
    render2FA();
    stopTimers();
    check('空列表显示空状态', !faEmpty.classList.contains('hidden'));
    my2faAccounts = [
        { id: 201, name: 'A', key: 'JBSWY3DPEHPK3PXP' },
        { id: 202, name: 'B', key: 'JBSWY3DPEHPK3PXQ' }
    ];
    render2FA();
    stopTimers();
    check('重新有数据后卡片与手柄恢复',
        faList.querySelectorAll('.fa-card').length === 2 &&
        Array.from(faList.querySelectorAll('.fa-card-header')).every(h => !!h.querySelector('.fa-card-drag-handle')));

    log(failed === 0 ? '\n全部用例通过' : '\n失败 ' + failed + ' 项');
    window.__failed = failed;
    window.__done = true;
})();
</script>
</body>
</html>
