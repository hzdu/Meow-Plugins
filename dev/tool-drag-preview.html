<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工具箱拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/sidepanel.css">
<style>
    body {
        width: 420px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-tools" class="view-content">
    <div class="tool-card" data-tool-id="tool-a">
        <h3><span class="mi fa-regular fa-globe"></span> <span>卡片 A</span> <span class="mi toggle-icon fa-regular fa-chevron-down"></span></h3>
        <div class="tool-body"><div style="height: 48px;"></div></div>
    </div>
    <div class="tool-card collapsed" data-tool-id="tool-b">
        <h3><span class="mi fa-regular fa-gas-pump"></span> <span>卡片 B</span> <span class="mi toggle-icon fa-regular fa-chevron-down"></span></h3>
        <div class="tool-body"><div style="height: 80px;"></div></div>
    </div>
    <div class="tool-card" data-tool-id="tool-c">
        <h3><span class="mi fa-regular fa-money-bill-transfer"></span> <span>卡片 C</span> <span class="mi toggle-icon fa-regular fa-chevron-down"></span></h3>
        <div class="tool-body"><div style="height: 120px;"></div></div>
    </div>
    <div class="tool-card collapsed" data-tool-id="tool-d">
        <h3><span class="mi fa-regular fa-location-dot"></span> <span>卡片 D</span> <span class="mi toggle-icon fa-regular fa-chevron-down"></span></h3>
        <div class="tool-body"><div style="height: 30px;"></div></div>
    </div>
    <div class="tool-card collapsed" data-tool-id="tool-e">
        <h3><span class="mi fa-regular fa-copy"></span> <span>卡片 E</span> <span class="mi toggle-icon fa-regular fa-chevron-down"></span></h3>
        <div class="tool-body"><div style="height: 30px;"></div></div>
    </div>
</div>

<div id="test-log"></div>

<script>
    // 最小 chrome API 垫片，供 i18n.js / sp-tools.js 在普通网页中运行
    window.chrome = window.chrome || {
        storage: {
            local: { get: (k, cb) => cb && cb({}), set: (o, cb) => cb && cb() },
            sync: { get: (k, cb) => cb && cb({}), set: (o, cb) => cb && cb() },
            onChanged: { addListener: () => {} }
        }
    };
</script>
<script src="../js/i18n.js"></script>
<script>var toolDragSrcIndex = null;</script>
<script src="../js/modules/sp-tools.js"></script>
<script>
(function () {
    const container = document.getElementById('view-tools');
    const logEl = document.getElementById('test-log');
    const lines = [];

    function log(text) {
        lines.push(text);
        logEl.textContent = lines.join('\n');
    }

    function ids() {
        return Array.from(container.querySelectorAll('.tool-card')).map(c => c.dataset.toolId);
    }

    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) window.__failed = (window.__failed || 0) + 1;
    }

    setupToolCardDrag();

    check('初始顺序 a,b,c,d,e', ids().join(',') === 'tool-a,tool-b,tool-c,tool-d,tool-e', ids().join(','));

    // ---- 模拟一次拖拽：按真实指针轨迹分步派发 dragover ----
    const dt = new DataTransfer();
    let draggingId = null;
    let grabX = 0, grabY = 0;

    function startDrag(toolId) {
        const card = container.querySelector('[data-tool-id="' + toolId + '"]');
        const h3 = card.querySelector('h3');
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 70;
        grabY = rect.top + 16;
        draggingId = toolId;
        h3.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
    }

    // 指针从起点移动到 targetY，按 8px 步进派发 dragover
    function moveTo(targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            container.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true,
                clientX: grabX, clientY: y,
                dataTransfer: dt
            }));
        }
        grabY = targetY;
    }

    function dropNow() {
        container.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
        container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    // ?demo=a 用于截图：把指定卡片拖到列表中下部后停住，保留拖拽中的视觉状态
    const demo = new URLSearchParams(location.search).get('demo');
    if (demo) {
        startDrag('tool-' + demo);
        const dropTarget = container.getBoundingClientRect().top +
            container.querySelector('[data-tool-id="tool-e"]').offsetTop - 30;
        moveTo(dropTarget);
        logEl.style.display = 'none';
        return;
    }

    // ===== 用例 1：把 A 一路拖到末尾 =====
    startDrag('tool-a');

    const ph1 = container.querySelector('.tool-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1);
    check('占位块紧邻原位置（A 之后）', ph1 && ph1.nextElementSibling && ph1.nextElementSibling.dataset.toolId === 'tool-a');
    check('被拖卡片进入 fixed 跟随', container.querySelector('[data-tool-id="tool-a"]').classList.contains('dragging-follow'));

    const beforeTops = new Map();
    container.querySelectorAll('.tool-card').forEach(c => {
        if (c.dataset.toolId !== 'tool-a') beforeTops.set(c.dataset.toolId, c.offsetTop);
    });

    const lastRect = container.querySelector('[data-tool-id="tool-e"]').getBoundingClientRect();
    moveTo(lastRect.bottom - 4);

    const ph2 = container.querySelector('.tool-drop-placeholder');
    check('占位块已下移到末尾', ph2 && ph2.nextElementSibling === null, 'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.toolId : 'null'));

    const movedCount = Array.from(container.querySelectorAll('.tool-card')).filter(c => {
        const id = c.dataset.toolId;
        if (id === 'tool-a') return false;
        return c.offsetTop !== beforeTops.get(id);
    }).length;
    check('其它卡片被让位推动（offsetTop 改变）', movedCount === 4, '改变数量 ' + movedCount + '/4');

    const phHeight = ph2 ? parseFloat(ph2.style.height) : 0;
    const aHeight = container.querySelector('[data-tool-id="tool-a"]').getBoundingClientRect().height;
    check('占位块高度与被拖卡片一致', Math.abs(phHeight - aHeight) < 1.5, phHeight.toFixed(1) + ' vs ' + aHeight.toFixed(1));

    dropNow();
    check('放下后顺序为 b,c,d,e,a', ids().join(',') === 'tool-b,tool-c,tool-d,tool-e,tool-a', ids().join(','));
    check('放下后占位块已移除', !container.querySelector('.tool-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !container.querySelector('.dragging-follow') &&
        !Array.from(container.querySelectorAll('.tool-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('放下后索引重排为 0..4',
        Array.from(container.querySelectorAll('.tool-card')).every((c, i) => c.dataset.index === String(i)));

    // ===== 用例 2：往回拖（验证上移方向） =====
    startDrag('tool-a');
    const bEl = container.querySelector('[data-tool-id="tool-b"]');
    const targetTop = container.getBoundingClientRect().top + bEl.offsetTop + 6;
    window.__trace = [];
    moveTo(targetTop);
    const ph3 = container.querySelector('.tool-drop-placeholder');
    check('上拖时占位块移到最前', ph3 && ph3.previousElementSibling === null);
    dropNow();
    check('上拖放下后 A 回到首位', ids()[0] === 'tool-a', ids().join(','));

    // ===== 用例 3：拖到区域外松手应取消 =====
    startDrag('tool-c');
    const before = ids().join(',');
    moveTo(container.querySelector('[data-tool-id="tool-e"]').getBoundingClientRect().bottom - 2);
    container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids().join(',') === before, before + ' → ' + ids().join(','));
    check('取消后无占位块残留', !container.querySelector('.tool-drop-placeholder'));

    window.__done = true;
})();
</script>
</body>
</html>
