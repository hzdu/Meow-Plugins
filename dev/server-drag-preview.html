<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>服务器卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/sidepanel.css">
<style>
    body {
        width: 420px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-servers" class="view-content">
    <div id="srv-list" class="srv-list">
        <div class="srv-card" data-id="srv-a">
            <div class="srv-card-header">
                <span class="mi srv-card-drag-handle fa-regular fa-grip-dots-vertical"></span>
                <span class="mi srv-card-toggle fa-regular fa-chevron-down"></span>
                <span class="srv-card-title"><span class="srv-card-name">卡片 A</span></span>
            </div>
            <div class="srv-card-body"><div style="height: 60px;"></div></div>
        </div>
        <div class="srv-card" data-id="srv-b">
            <div class="srv-card-header">
                <span class="mi srv-card-drag-handle fa-regular fa-grip-dots-vertical"></span>
                <span class="mi srv-card-toggle fa-regular fa-chevron-down"></span>
                <span class="srv-card-title"><span class="srv-card-name">卡片 B</span></span>
            </div>
            <div class="srv-card-body" style="display:none"><div style="height: 120px;"></div></div>
        </div>
        <div class="srv-card" data-id="srv-c">
            <div class="srv-card-header">
                <span class="mi srv-card-drag-handle fa-regular fa-grip-dots-vertical"></span>
                <span class="mi srv-card-toggle fa-regular fa-chevron-down"></span>
                <span class="srv-card-title"><span class="srv-card-name">卡片 C</span></span>
            </div>
            <div class="srv-card-body"><div style="height: 90px;"></div></div>
        </div>
        <div class="srv-card" data-id="srv-d" style="display:none">
            <div class="srv-card-header">
                <span class="mi srv-card-drag-handle fa-regular fa-grip-dots-vertical"></span>
                <span class="mi srv-card-toggle fa-regular fa-chevron-down"></span>
                <span class="srv-card-title"><span class="srv-card-name">卡片 D（被筛选隐藏）</span></span>
            </div>
            <div class="srv-card-body"><div style="height: 30px;"></div></div>
        </div>
        <div class="srv-card" data-id="srv-e">
            <div class="srv-card-header">
                <span class="mi srv-card-drag-handle fa-regular fa-grip-dots-vertical"></span>
                <span class="mi srv-card-toggle fa-regular fa-chevron-down"></span>
                <span class="srv-card-title"><span class="srv-card-name">卡片 E</span></span>
            </div>
            <div class="srv-card-body"><div style="height: 30px;"></div></div>
        </div>
    </div>
</div>

<div id="test-log"></div>

<script>
    // 最小 chrome API 垫片 + 存储记录，供 sp-servers.js 在普通网页中运行
    window.__savedServers = null;
    // Edge/Chrome 自带 window.chrome（但没有 storage），直接赋值会沿用原生对象，
    // 所以这里显式重建 storage 垫片。
    window.chrome = {
        storage: {
            local: {
                get: (keys, cb) => cb && cb({}),
                set: (obj, cb) => {
                    if (obj && obj.meow_servers) window.__savedServers = obj.meow_servers;
                    cb && cb();
                }
            },
            sync: { get: (k, cb) => cb && cb({}), set: (o, cb) => cb && cb() },
            onChanged: { addListener: () => {} }
        },
        runtime: { sendMessage: () => {} }
    };
</script>
<script src="../js/utils.js"></script>
<script>
    // 拖拽相关状态全部由 sp-servers.js 自己声明，这里不重复声明（否则 SyntaxError）
</script>
<script src="../js/modules/sp-servers.js"></script>
<script>
// 宿主的服务器数据：含一个被筛选隐藏的 D
myServers = [
    { id: 'srv-a', title: '卡片 A' },
    { id: 'srv-b', title: '卡片 B' },
    { id: 'srv-c', title: '卡片 C' },
    { id: 'srv-d', title: '卡片 D' },
    { id: 'srv-e', title: '卡片 E' }
];
</script>
<script>
(function () {
    const container = document.getElementById('srv-list');
    const logEl = document.getElementById('test-log');
    const lines = [];

    function log(text) {
        lines.push(text);
        logEl.textContent = lines.join('\n');
    }

    function ids(all) {
        return Array.from(container.querySelectorAll('.srv-card'))
            .filter(c => all || c.style.display !== 'none')
            .map(c => c.dataset.id);
    }

    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) window.__failed = (window.__failed || 0) + 1;
    }

    setupSrvCardDrag();

    check('只有标题栏是拖拽手柄，卡片本体不 draggable',
        !container.querySelector('.srv-card[draggable="true"]') &&
        Array.from(container.querySelectorAll('.srv-card-header')).every(h => h.getAttribute('draggable') === 'true'));

    // ---- 模拟一次拖拽：按真实指针轨迹分步派发 dragover ----
    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;

    function startDrag(id) {
        const card = container.querySelector('[data-id="' + id + '"]');
        const header = card.querySelector('.srv-card-header');
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 70;
        grabY = rect.top + 12;
        header.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
    }

    function moveTo(targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            container.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true,
                clientX: grabX, clientY: y,
                dataTransfer: dt
            }));
        }
        grabY = targetY;
    }

    function dropNow() {
        container.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
        container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    // ===== 用例 1：把 A 一路拖到可视末尾（跳过隐藏的 D） =====
    startDrag('srv-a');

    const ph1 = container.querySelector('.srv-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1);
    check('占位块紧邻原位置（A 之后）', ph1 && ph1.nextElementSibling && ph1.nextElementSibling.dataset.id === 'srv-a');
    check('被拖卡片进入 fixed 跟随', container.querySelector('[data-id="srv-a"]').classList.contains('dragging-follow'));
    check('原生拖影被关掉（body 上无残留拖拽 ghost 类）', !document.body.classList.contains('dragging'));

    const beforeTops = new Map();
    Array.from(container.querySelectorAll('.srv-card')).forEach(c => {
        if (c.dataset.id !== 'srv-a') beforeTops.set(c.dataset.id, c.offsetTop);
    });

    const eRect = container.querySelector('[data-id="srv-e"]').getBoundingClientRect();
    moveTo(eRect.bottom - 4);

    const ph2 = container.querySelector('.srv-drop-placeholder');
    check('占位块已下移到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.id : 'null'));

    // 被拖卡片从首位拖到末尾：它原来占的高度塌陷，中间/末尾的可见卡片（b、c、e）
    // 都会上移，所以改变数量应为 3。
    const movedIds = Array.from(container.querySelectorAll('.srv-card')).filter(c => {
        const id = c.dataset.id;
        if (id === 'srv-a' || c.style.display === 'none') return false;
        return c.offsetTop !== beforeTops.get(id);
    }).map(c => c.dataset.id);
    check('其它可见卡片被让位推动（offsetTop 改变）', movedIds.join(',') === 'srv-b,srv-c,srv-e', '改变: ' + movedIds.join(','));

    const phHeight = ph2 ? parseFloat(ph2.style.height) : 0;
    const aHeight = container.querySelector('[data-id="srv-a"]').getBoundingClientRect().height;
    check('占位块高度与被拖卡片一致', Math.abs(phHeight - aHeight) < 1.5, phHeight.toFixed(1) + ' vs ' + aHeight.toFixed(1));

    dropNow();
    check('放下后可见顺序为 b,c,e,a', ids().join(',') === 'srv-b,srv-c,srv-e,srv-a', ids().join(','));
    check('放下后占位块已移除', !container.querySelector('.srv-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !container.querySelector('.dragging-follow') &&
        !Array.from(container.querySelectorAll('.srv-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('放下后索引重排为 0..4',
        Array.from(container.querySelectorAll('.srv-card')).every((c, i) => c.dataset.index === String(i)));

    // 隐藏卡片位置不变：数据层 D 仍在第 4 位
    const saved1 = window.__savedServers || myServers;
    check('数据层只重排可见项，隐藏的 D 保持原位',
        saved1.map(s => s.id).join(',') === 'srv-b,srv-c,srv-e,srv-d,srv-a',
        saved1.map(s => s.id).join(','));

    // ===== 用例 2：往回拖（验证上移方向） =====
    startDrag('srv-a');
    const bEl = container.querySelector('[data-id="srv-b"]');
    moveTo(container.getBoundingClientRect().top + bEl.offsetTop + 6);
    const ph3 = container.querySelector('.srv-drop-placeholder');
    check('上拖时占位块移到最前', ph3 && !ph3.previousElementSibling);
    dropNow();
    check('上拖放下后 A 回到首位', ids()[0] === 'srv-a', ids().join(','));

    // ===== 用例 3：只有标题栏起拖；内容区拖拽被忽略 =====
    const cardC = container.querySelector('[data-id="srv-c"]');
    const bodyC = cardC.querySelector('.srv-card-body');
    const before2 = ids(true).join(',');
    bodyC.dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('内容区拖拽不触发卡片排序', !container.querySelector('.srv-drop-placeholder') && ids(true).join(',') === before2);

    // ===== 用例 4：拖到区域外松手应取消 =====
    startDrag('srv-c');
    const before3 = ids().join(',');
    moveTo(container.querySelector('[data-id="srv-e"]').getBoundingClientRect().bottom - 2);
    container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids().join(',') === before3, before3 + ' → ' + ids().join(','));
    check('取消后无占位块残留', !container.querySelector('.srv-drop-placeholder'));

    window.__done = true;
})();
</script>
</body>
</html>
