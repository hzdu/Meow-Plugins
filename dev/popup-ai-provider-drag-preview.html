<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弹出窗口 AI Provider 卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/popup.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
    body {
        width: 400px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-ai-provider">
    <div class="ai-provider-panel">
        <div class="ai-filter-row">
            <input type="text" id="ai-filter-input" class="ai-filter-input" placeholder="搜索标题或 Model...">
        </div>
        <div id="ai-list" class="q-list"></div>
        <div id="ai-empty" class="empty-state hidden"><p></p></div>
    </div>
</div>

<div id="test-log"></div>

<script src="../js/utils.js"></script>
<script>
    // 最小宿主垫片：popup-ai.js 依赖的全局（与 popup-core.js 同名）
    let myAiProviders = [
        { id: 1, title: 'Provider 1', baseUrls: ['https://a.example.com'], models: ['m-a1'], key: 'sk-aaaaaaaaaaaa1111', apiType: 'openai' },
        { id: 2, title: 'Provider 2', baseUrls: ['https://b.example.com'], models: ['m-b2'], key: 'sk-bbbbbbbbbbbb2222', apiType: 'openai' },
        { id: 3, title: 'Provider 3', baseUrls: ['https://c.example.com'], models: ['m-a3'], key: 'sk-cccccccccccc3333', apiType: 'anthropic' },
        { id: 4, title: 'Provider 4', baseUrls: ['https://d.example.com'], models: ['m-c4'], key: 'sk-dddddddddddd4444', apiType: 'openai', note: '一条备注' },
        { id: 5, title: 'Provider 5', baseUrls: ['https://e.example.com'], models: ['m-a5'], key: 'sk-eeeeeeeeeeee5555', apiType: 'openai' }
    ];
    let editingAiId = null;

    const aiList = document.getElementById('ai-list');
    const aiEmpty = document.getElementById('ai-empty');
    const aiFilterInput = document.getElementById('ai-filter-input');
    const meowI18n = { t: k => k };

    function showToast() {}
    function showConfirmDialog() { return Promise.resolve(true); }
    function copyToClipboard() {}

    // popup-ai.js 载入时会做存在性判断的其它 UI 元素
    const aiProviderFetchModelsBtn = null;
    const aiProviderModelSelectModal = null;
    const closeAiProviderModelSelectModal = null;
    const aiProviderModelSelectCancelBtn = null;
    const aiProviderModelSelectAllBtn = null;
    const aiProviderModelSelectNoneBtn = null;
    const aiProviderModelSelectSearchInput = null;
    const aiProviderModelSelectAddBtn = null;
</script>
<script src="../js/modules/card-drag.js"></script>
<script src="../js/modules/popup-ai.js"></script>
<script>
(function () {
    // 拦截落盘：记录保存次数与快照，不依赖 chrome.storage
    window.__saveCount = 0;
    window.__savedOrder = null;
    saveAIProviders = function () {
        window.__saveCount++;
        window.__savedOrder = myAiProviders.map(p => p.id);
    };

    const logEl = document.getElementById('test-log');
    const lines = [];
    let failed = 0;
    function log(text) { lines.push(text); logEl.textContent = lines.join('\n'); }
    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) failed++;
    }
    function ids() {
        return Array.from(aiList.querySelectorAll('.ai-card')).map(c => c.dataset.id).join(',');
    }
    function visibleIds() {
        return Array.from(aiList.querySelectorAll('.ai-card'))
            .filter(c => c.style.display !== 'none')
            .map(c => c.dataset.id).join(',');
    }

    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;

    function startDrag(id) {
        const card = aiList.querySelector('[data-id="' + id + '"]');
        const header = card.querySelector('.ai-card-header');
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 70;
        grabY = rect.top + 12;
        header.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true, clientX: grabX, clientY: grabY, dataTransfer: dt
        }));
        return card;
    }
    function moveTo(targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            aiList.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true, clientX: grabX, clientY: y, dataTransfer: dt
            }));
        }
        grabY = targetY;
    }
    function dropNow() {
        aiList.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true, clientX: grabX, clientY: grabY, dataTransfer: dt
        }));
        aiList.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    renderAIProviders();

    check('卡片渲染完成（5 张）', aiList.querySelectorAll('.ai-card').length === 5,
        String(aiList.querySelectorAll('.ai-card').length));
    check('只有标题栏是拖拽手柄，卡片本体不 draggable',
        !aiList.querySelector('.ai-card[draggable="true"]') &&
        Array.from(aiList.querySelectorAll('.ai-card-header')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张卡片都有 Material 图标 grip 手柄',
        Array.from(aiList.querySelectorAll('.ai-card-header')).every(h => {
            const g = h.firstElementChild;
            return g && g.classList.contains('ai-card-drag-handle') && g.classList.contains('material-icons') && g.textContent === 'drag_indicator';
        }));
    check('#ai-list 是定位容器（落点判断依赖 offsetTop）',
        aiList.querySelector('.ai-card').offsetParent === aiList);

    // ===== 用例 1：第一张拖到末尾 =====
    const firstCard = startDrag(1);
    const ph1 = aiList.querySelector('.ai-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1 && ph1.previousElementSibling === null);
    check('被拖卡片进入 fixed 跟随', firstCard.classList.contains('dragging-follow'));

    const card2TopBefore = aiList.querySelector('[data-id="2"]').offsetTop;
    const phH = ph1 ? ph1.offsetHeight : 0;
    const cardH = firstCard.getBoundingClientRect().height;
    check('占位块高度与被拖卡片一致', Math.abs(phH - cardH) < 1.5, phH.toFixed(1) + ' vs ' + cardH.toFixed(1));
    check('占位块接下卡片原来的间距（卡片不跳位）',
        Math.abs(aiList.querySelector('[data-id="2"]').offsetTop - card2TopBefore) < 0.5,
        '卡2 offsetTop ' + card2TopBefore + ' → ' + aiList.querySelector('[data-id="2"]').offsetTop);

    const beforeTops = new Map();
    Array.from(aiList.querySelectorAll('.ai-card')).forEach(c => {
        if (c.dataset.id !== '1') beforeTops.set(c.dataset.id, c.offsetTop);
    });
    moveTo(aiList.querySelector('[data-id="5"]').getBoundingClientRect().bottom - 4);

    const ph2 = aiList.querySelector('.ai-drop-placeholder');
    check('占位块已下移到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.id : 'null'));
    const moved = Array.from(aiList.querySelectorAll('.ai-card')).filter(c => {
        if (c.dataset.id === '1') return false;
        return c.offsetTop !== beforeTops.get(c.dataset.id);
    }).map(c => c.dataset.id);
    check('其它卡片被让位推动', moved.join(',') === '2,3,4,5', '改变: ' + moved.join(','));

    const saves1 = window.__saveCount;
    dropNow();
    check('放下后顺序为 2,3,4,5,1', ids() === '2,3,4,5,1', ids());
    check('放下后占位块已移除', !aiList.querySelector('.ai-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !aiList.querySelector('.dragging-follow') &&
        !Array.from(aiList.querySelectorAll('.ai-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('数据层顺序同步为 2,3,4,5,1',
        (window.__savedOrder || []).join(',') === '2,3,4,5,1', (window.__savedOrder || []).join(','));
    check('顺序变化时写了一次存储', window.__saveCount === saves1 + 1, String(window.__saveCount - saves1));
    check('重渲染后仍带 grip 手柄',
        Array.from(aiList.querySelectorAll('.ai-card-header')).every(h => !!h.querySelector('.ai-card-drag-handle')));
    check('索引重排为 0..4',
        Array.from(aiList.querySelectorAll('.ai-card')).every((c, i) => c.dataset.index === String(i)));

    // ===== 用例 2：往回拖（验证上移方向） =====
    startDrag(1);
    const secondEl = aiList.querySelector('[data-id="2"]');
    moveTo(aiList.getBoundingClientRect().top + secondEl.offsetTop + 6);
    check('上拖时占位块移到最前', (function () {
        const ph = aiList.querySelector('.ai-drop-placeholder');
        return ph && !ph.previousElementSibling;
    })());
    dropNow();
    check('上拖放下后 1 回到首位', ids().split(',')[0] === '1', ids());

    // ===== 用例 3：原地放下不写存储 =====
    const saves2 = window.__saveCount;
    startDrag(2);
    const r2 = aiList.querySelector('[data-id="2"]').getBoundingClientRect();
    moveTo(r2.top + 4);
    dropNow();
    check('原地放下顺序不变', ids() === '1,2,3,4,5', ids());
    check('原地放下不写存储', window.__saveCount === saves2, String(window.__saveCount - saves2));

    // ===== 用例 4：操作按钮 / 内容区起拖被忽略 =====
    const card3 = aiList.querySelector('[data-id="3"]');
    const beforeIds = ids();
    card3.querySelector('.ai-edit-btn').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    card3.querySelector('.ai-card-body').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('操作按钮/内容区起拖不触发排序',
        !aiList.querySelector('.ai-drop-placeholder') && ids() === beforeIds);

    // ===== 用例 5：拖到区域外松手应取消 =====
    startDrag(4);
    const beforeCancel = ids();
    moveTo(aiList.querySelector('[data-id="5"]').getBoundingClientRect().bottom - 2);
    aiList.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids() === beforeCancel, beforeCancel + ' → ' + ids());
    check('取消后无占位块残留', !aiList.querySelector('.ai-drop-placeholder'));

    // ===== 用例 6：标题栏点击仍能展开/收起，点手柄不触发 =====
    const header3 = aiList.querySelector('[data-id="3"] .ai-card-header');
    header3.querySelector('.ai-card-name').click();
    const expanded = aiList.querySelector('[data-id="3"]').classList.contains('expanded') &&
        aiList.querySelector('[data-id="3"] .ai-card-body').style.display !== 'none';
    check('点标题栏名称仍可展开卡片', expanded);
    header3.querySelector('.ai-card-name').click();
    check('再点一次收起', !aiList.querySelector('[data-id="3"]').classList.contains('expanded'));
    header3.querySelector('.ai-card-drag-handle').click();
    check('点 grip 手柄不触发展开/收起', !aiList.querySelector('[data-id="3"]').classList.contains('expanded'));

    // ===== 用例 7：过滤时只重排可见项 =====
    aiFilterInput.value = 'm-a';
    renderAIProviders();
    check('过滤后只剩 1、3、5（m-a）', visibleIds() === '1,3,5', visibleIds());
    check('被过滤的卡片仍是 display:none 留在 DOM 里', ids() === '1,2,3,4,5', ids());

    startDrag(1);
    moveTo(aiList.querySelector('[data-id="5"]').getBoundingClientRect().bottom - 3);
    dropNow();
    check('过滤内拖拽：可见项新顺序为 3,5,1', visibleIds() === '3,5,1', visibleIds());

    aiFilterInput.value = '';
    renderAIProviders();
    // 槽位语义（与侧边栏一致）：可见项换槽位，隐藏项 2、4 保持原位
    check('取消过滤后隐藏项仍在原位（3,2,5,4,1）', ids() === '3,2,5,4,1', ids());

    // ===== 用例 8：清空后重新渲染仍挂手柄 =====
    myAiProviders = [];
    renderAIProviders();
    check('空列表显示空状态', !aiEmpty.classList.contains('hidden'));
    myAiProviders = [
        { id: 201, title: 'A', baseUrls: ['https://a.example.com'], models: ['m1'], key: 'sk-1234567890abcdef', apiType: 'openai' },
        { id: 202, title: 'B', baseUrls: ['https://b.example.com'], models: ['m2'], key: 'sk-abcdef1234567890', apiType: 'openai' }
    ];
    renderAIProviders();
    check('重新有数据后卡片与手柄恢复',
        aiList.querySelectorAll('.ai-card').length === 2 &&
        Array.from(aiList.querySelectorAll('.ai-card-header')).every(h => !!h.querySelector('.ai-card-drag-handle')));

    log(failed === 0 ? '\n全部用例通过' : '\n失败 ' + failed + ' 项');
    window.__failed = failed;
    window.__done = true;
})();
</script>
</body>
</html>
