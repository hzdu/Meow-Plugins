<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提示词 / 暂存板卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/sidepanel.css">
<style>
    body {
        width: 460px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<h4 style="font-size:12px;color:#64748b;margin:8px 0 6px;">AI 提示词</h4>
<!-- 与真实侧边栏一致：卡片列表位于 position:relative 容器的顶部，
     这样卡片 offsetTop 与容器相对坐标同一基准（落点判断依赖这个前提） -->
<div class="list-section" style="position: relative;">
    <div class="view-content">
        <ul id="sp-list" class="prompt-list"></ul>
        <div id="sp-empty" class="empty-state hidden"><p>空</p></div>
    </div>
</div>

<h4 style="font-size:12px;color:#64748b;margin:14px 0 6px;">暂存板</h4>
<div class="list-section" style="position: relative;">
    <div class="view-content">
        <ul id="scratch-list" class="scratch-list"></ul>
        <div id="scratch-empty" class="empty-state hidden"><p>空</p></div>
    </div>
</div>

<div id="test-log"></div>

<!-- 模块加载时即读取的宿主元素（预览页只需存在，不参与断言） -->
<div style="display:none">
    <div id="sp-filters"></div>
    <select id="sp-category"></select>
    <input id="sp-title"><textarea id="sp-content"></textarea>
    <button id="sp-add-btn"></button><button id="sp-cancel-btn"></button>
    <div id="prompt-collapse-header"></div><div id="prompt-collapse-body"></div>
    <input id="search-prompts-input"><input id="search-scratch-input">

    <div id="prompt-view-modal" class="hidden">
        <input id="prompt-view-title-input"><textarea id="prompt-view-textarea"></textarea>
        <button id="prompt-view-selectall-btn"></button><button id="prompt-view-copy-btn"></button>
        <button id="prompt-view-cancel-btn"></button><button id="prompt-view-save-btn"></button>
        <span id="close-prompt-view-modal"></span>
    </div>

    <div id="scratch-collapse-header"></div><div id="scratch-collapse-body"></div>
    <div id="scratch-input" contenteditable="true"></div>
    <button id="scratch-add-btn"></button><button id="sp-clear-all"></button>

    <div id="scratch-edit-modal" class="hidden">
        <div id="scratch-modal-input" contenteditable="true"></div>
        <button id="scratch-modal-save"></button><button id="scratch-modal-cancel"></button>
        <span id="close-scratch-modal"></span>
        <button id="scratch-modal-selectall"></button><button id="scratch-modal-copy"></button>
    </div>

    <div id="text-view-modal" class="hidden"><span id="close-text-modal"></span><div id="text-modal-content"></div></div>
</div>

<script src="../js/utils.js"></script>
<script>
    // ===== 最小宿主垫片：替代 sp-core.js 提供的全局状态与元素引用 =====
    let myPrompts = [
        { id: 1, title: '标题一', content: '正文一', category: 'chatgpt' },
        { id: 2, title: '标题二', content: '正文二', category: 'coding' },
        { id: 3, title: '标题三', content: '正文三', category: 'chatgpt' },
        { id: 4, title: '标题四', content: '正文四', category: 'coding' },
        { id: 5, title: '标题五', content: '正文五', category: 'chatgpt' }
    ];
    let promptCategories = [
        { id: 'chatgpt', name: 'ChatGPT' },
        { id: 'coding', name: '代码' }
    ];
    let currentFilter = 'all';
    let editingPromptId = null;
    let myScratchList = [
        { id: 201, content: '便签 A', time: 1700000001000 },
        { id: 202, content: '便签 B', time: 1700000004000 },
        { id: 203, content: '便签 C', time: 1700000002000 },
        { id: 204, content: '便签 D', time: 1700000003000 }
    ];
    let currentScratchEditId = null;

    const meowI18n = { lang: 'zh-CN', t: k => k };
    const categorySelect = document.getElementById('sp-category');
    const titleInput = document.getElementById('sp-title');
    const contentInput = document.getElementById('sp-content');
    const addBtn = document.getElementById('sp-add-btn');
    const cancelBtn = document.getElementById('sp-cancel-btn');
    const filterContainer = document.getElementById('sp-filters');
    const listContainer = document.getElementById('sp-list');
    const emptyState = document.getElementById('sp-empty');
    const promptHeader = document.getElementById('prompt-collapse-header');
    const promptBody = document.getElementById('prompt-collapse-body');
    const searchPromptsInput = document.getElementById('search-prompts-input');
    const searchScratchInput = document.getElementById('search-scratch-input');

    const scratchList = document.getElementById('scratch-list');
    const scratchEmpty = document.getElementById('scratch-empty');
    const scratchInput = document.getElementById('scratch-input');
    const scratchAddBtn = document.getElementById('scratch-add-btn');
    const scratchClearBtn = document.getElementById('sp-clear-all');
    const scratchHeader = document.getElementById('scratch-collapse-header');
    const scratchBody = document.getElementById('scratch-collapse-body');
    const scratchEditModal = document.getElementById('scratch-edit-modal');
    const scratchModalInput = document.getElementById('scratch-modal-input');
    const scratchModalSaveBtn = document.getElementById('scratch-modal-save');
    const scratchModalCancelBtn = document.getElementById('scratch-modal-cancel');
    const closeScratchModalBtn = document.getElementById('close-scratch-modal');
    const scratchModalSelectAllBtn = document.getElementById('scratch-modal-selectall');
    const scratchModalCopyBtn = document.getElementById('scratch-modal-copy');
    const textViewModal = document.getElementById('text-view-modal');
    const closeTextViewModal = document.getElementById('close-text-modal');
    const textViewContent = document.getElementById('text-modal-content');

    window.__saveCount = 0;
    window.__savedPrompts = null;
    window.__savedScratch = null;
    function saveData() {
        window.__saveCount++;
        window.__savedPrompts = JSON.parse(JSON.stringify(myPrompts));
        window.__savedScratch = JSON.parse(JSON.stringify(myScratchList));
    }
    function showToast() {}
    function showConfirmDialog() { return Promise.resolve(true); }
    function copyToClipboard() {}
    function sanitizeHtml(html) { return html; }
    function formatTime(t) { return String(t); }
</script>
<script src="../js/modules/card-drag.js"></script>
<script src="../js/modules/sp-prompts.js"></script>
<script src="../js/modules/sp-scratchpad.js"></script>
<script>
(function () {
    const logEl = document.getElementById('test-log');
    const lines = [];
    let failed = 0;
    function log(text) { lines.push(text); logEl.textContent = lines.join('\n'); }
    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) failed++;
    }
    function ids(container, selector) {
        return Array.from(container.querySelectorAll(selector)).map(c => c.dataset.id).join(',');
    }
    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;
    function startDrag(container, selector, id) {
        const card = container.querySelector('[data-id="' + id + '"]');
        const header = card.querySelector(selector);
        const rect = card.getBoundingClientRect();
        grabX = rect.left + 80;
        grabY = rect.top + 10;
        header.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true, clientX: grabX, clientY: grabY, dataTransfer: dt
        }));
        return card;
    }
    function moveTo(container, targetY) {
        const dir = targetY > grabY ? 1 : -1;
        for (let y = grabY; dir > 0 ? y <= targetY : y >= targetY; y += dir * 8) {
            container.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true, clientX: grabX, clientY: y, dataTransfer: dt
            }));
        }
        grabY = targetY;
    }
    function dropNow(container) {
        container.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true, clientX: grabX, clientY: grabY, dataTransfer: dt
        }));
        container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    // ================= AI 提示词 =================
    renderPromptList();

    check('提示词卡片渲染完成（5 张）', listContainer.querySelectorAll('.prompt-card').length === 5,
        String(listContainer.querySelectorAll('.prompt-card').length));
    check('旧数据首屏仍按 id 倒序展示（未改变原有观感）',
        ids(listContainer, '.prompt-card') === '5,4,3,2,1', ids(listContainer, '.prompt-card'));
    check('旧数据已补出 order 字段 0..4',
        myPrompts.slice().sort((a, b) => a.order - b.order).map(p => p.id).join(',') === '5,4,3,2,1',
        myPrompts.map(p => p.id + ':' + p.order).join(' '));
    check('只有标题行是拖拽手柄，卡片本体不 draggable',
        !listContainer.querySelector('.prompt-card[draggable="true"]') &&
        Array.from(listContainer.querySelectorAll('.p-header')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张提示词卡片都有 grip 手柄',
        Array.from(listContainer.querySelectorAll('.p-header')).every(h => !!h.querySelector('.prompt-drag-handle')));

    // 用例 1：把第一张拖到末尾
    const card5 = startDrag(listContainer, '.p-header', 5);
    const ph1 = listContainer.querySelector('.prompt-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1);
    check('占位块为 li（不破坏 ul 结构）', ph1 && ph1.tagName === 'LI');
    check('占位块紧邻原位置（id=5 之后）', ph1 && ph1.nextElementSibling && ph1.nextElementSibling.dataset.id === '5');
    check('被拖卡片进入 fixed 跟随', card5.classList.contains('dragging-follow'));

    const beforeTops = new Map();
    Array.from(listContainer.querySelectorAll('.prompt-card')).forEach(c => {
        if (c.dataset.id !== '5') beforeTops.set(c.dataset.id, c.offsetTop);
    });

    moveTo(listContainer, listContainer.querySelector('[data-id="1"]').getBoundingClientRect().bottom - 4);
    const ph2 = listContainer.querySelector('.prompt-drop-placeholder');
    check('占位块已下移到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.id : 'null'));
    const moved = Array.from(listContainer.querySelectorAll('.prompt-card')).filter(c => {
        const id = c.dataset.id;
        if (id === '5') return false;
        return c.offsetTop !== beforeTops.get(id);
    }).map(c => c.dataset.id);
    check('其它卡片被让位推动', moved.join(',') === '4,3,2,1', '改变: ' + moved.join(','));
    const phHeight = ph2 ? parseFloat(ph2.style.height) : 0;
    check('占位块高度与被拖卡片一致',
        Math.abs(phHeight - card5.getBoundingClientRect().height) < 1.5,
        phHeight.toFixed(1) + ' vs ' + card5.getBoundingClientRect().height.toFixed(1));

    const saves1 = window.__saveCount;
    dropNow(listContainer);
    check('放下后顺序为 4,3,2,1,5', ids(listContainer, '.prompt-card') === '4,3,2,1,5', ids(listContainer, '.prompt-card'));
    check('放下后占位块已移除', !listContainer.querySelector('.prompt-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !listContainer.querySelector('.dragging-follow') &&
        !Array.from(listContainer.querySelectorAll('.prompt-card')).some(c => c.style.position === 'fixed' || c.style.transform));
    check('索引重排为 0..4',
        Array.from(listContainer.querySelectorAll('.prompt-card')).every((c, i) => c.dataset.index === String(i)));
    check('重渲染后仍带 grip 手柄',
        Array.from(listContainer.querySelectorAll('.p-header')).every(h => !!h.querySelector('.prompt-drag-handle')));
    check('数据层顺序同步为 4,3,2,1,5',
        (window.__savedPrompts || []).slice().sort((a, b) => a.order - b.order).map(p => p.id).join(',') === '4,3,2,1,5',
        (window.__savedPrompts || []).slice().sort((a, b) => a.order - b.order).map(p => p.id + ':' + p.order).join(' '));
    check('顺序变化时写了一次存储', window.__saveCount === saves1 + 1, String(window.__saveCount - saves1));

    // 用例 2：往回拖（验证上移方向）
    startDrag(listContainer, '.p-header', 5);
    const card4El = listContainer.querySelector('[data-id="4"]');
    moveTo(listContainer, listContainer.getBoundingClientRect().top + card4El.offsetTop + 4);
    const ph3 = listContainer.querySelector('.prompt-drop-placeholder');
    check('上拖时占位块移到最前', ph3 && !ph3.previousElementSibling);
    dropNow(listContainer);
    check('上拖放下后 5 回到首位', ids(listContainer, '.prompt-card').split(',')[0] === '5', ids(listContainer, '.prompt-card'));

    // 用例 3：原地放下不写存储
    const saves2 = window.__saveCount;
    const card4 = startDrag(listContainer, '.p-header', 4);
    const r4 = card4.getBoundingClientRect();
    moveTo(listContainer, r4.top + 3);
    dropNow(listContainer);
    check('原地放下顺序不变', ids(listContainer, '.prompt-card') === '5,4,3,2,1', ids(listContainer, '.prompt-card'));
    check('原地放下不写存储', window.__saveCount === saves2, String(window.__saveCount - saves2));

    // 用例 4：内容区 / 下拉框起拖被忽略
    const card3 = listContainer.querySelector('[data-id="3"]');
    const beforeIds = ids(listContainer, '.prompt-card');
    card3.querySelector('.p-content').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    card3.querySelector('.p-cat-select').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('正文/分类下拉起拖不触发排序',
        !listContainer.querySelector('.prompt-drop-placeholder') && ids(listContainer, '.prompt-card') === beforeIds);

    // 用例 5：拖到区域外松手应取消
    startDrag(listContainer, '.p-header', 3);
    const beforeCancel = ids(listContainer, '.prompt-card');
    moveTo(listContainer, listContainer.querySelector('[data-id="1"]').getBoundingClientRect().bottom - 2);
    listContainer.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', ids(listContainer, '.prompt-card') === beforeCancel,
        beforeCancel + ' → ' + ids(listContainer, '.prompt-card'));
    check('取消后无占位块残留', !listContainer.querySelector('.prompt-drop-placeholder'));

    // 用例 6：分类筛选下的排序只动可见项
    currentFilter = 'chatgpt'; // 可见：5、3、1
    renderPromptList();
    const hiddenOrders = myPrompts.filter(p => p.category !== 'chatgpt')
        .map(p => p.id + ':' + p.order).sort().join(' ');
    check('筛选后只显示 chatgpt 分类（5,3,1）', ids(listContainer, '.prompt-card') === '5,3,1', ids(listContainer, '.prompt-card'));
    startDrag(listContainer, '.p-header', 5);
    moveTo(listContainer, listContainer.querySelector('[data-id="1"]').getBoundingClientRect().bottom - 3);
    dropNow(listContainer);
    const hiddenOrdersAfter = myPrompts.filter(p => p.category !== 'chatgpt')
        .map(p => p.id + ':' + p.order).sort().join(' ');
    check('筛选内拖拽：可见项新顺序为 3,1,5', ids(listContainer, '.prompt-card') === '3,1,5', ids(listContainer, '.prompt-card'));
    check('筛选内拖拽：被隐藏项 order 不变', hiddenOrdersAfter === hiddenOrders,
        hiddenOrders + ' → ' + hiddenOrdersAfter);
    // 槽位语义（与服务器管理一致）：可见项只占用自己那几个 order 槽位（0,2,4），
    // 隐藏项（4:1、2:3）保持原位，所以全部显示时为 3,4,1,2,5
    check('取消筛选后隐藏项仍在原位（可见项换槽位，隐藏项不动）',
        (function () {
            currentFilter = 'all';
            renderPromptList();
            const full = ids(listContainer, '.prompt-card');
            currentFilter = 'chatgpt';
            renderPromptList();
            window.__fullOrder = full;
            return full === '3,4,1,2,5';
        })(), 'full=' + (window.__fullOrder || '?'));

    // 用例 7：编辑提示词保留 order
    currentFilter = 'all';
    renderPromptList();
    const target = myPrompts.find(p => p.id === 3);
    const orderBefore = target.order;
    editingPromptId = 3;
    titleInput.value = '改过的标题';
    contentInput.value = '改过的正文';
    categorySelect.value = target.category;
    addBtn.click();
    check('编辑后 order 不变', myPrompts.find(p => p.id === 3).order === orderBefore,
        orderBefore + ' → ' + myPrompts.find(p => p.id === 3).order);
    check('编辑后卡片位置不变', ids(listContainer, '.prompt-card') === '3,4,1,2,5', ids(listContainer, '.prompt-card'));

    // 用例 8：新增提示词排在最前
    const addBefore = ids(listContainer, '.prompt-card');
    editingPromptId = null;
    titleInput.value = '新提示词';
    contentInput.value = '新内容';
    categorySelect.value = 'chatgpt';
    addBtn.click();
    check('新增提示词出现在最前面',
        listContainer.querySelector('.prompt-card').querySelector('.p-title').textContent === '新提示词',
        '之前: ' + addBefore);

    // ================= 暂存板 =================
    renderScratchList();
    check('暂存板卡片渲染完成（4 张）', scratchList.querySelectorAll('.scratch-card').length === 4,
        String(scratchList.querySelectorAll('.scratch-card').length));
    check('旧数据首屏仍按时间倒序（202,204,203,201）',
        ids(scratchList, '.scratch-card') === '202,204,203,201', ids(scratchList, '.scratch-card'));
    check('旧数据已补出 order',
        myScratchList.slice().sort((a, b) => a.order - b.order).map(s => s.id).join(',') === '202,204,203,201',
        myScratchList.map(s => s.id + ':' + s.order).join(' '));
    check('标题行是拖拽手柄，卡片本体不 draggable',
        !scratchList.querySelector('.scratch-card[draggable="true"]') &&
        Array.from(scratchList.querySelectorAll('.scratch-meta')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张暂存卡片都有 grip 手柄',
        Array.from(scratchList.querySelectorAll('.scratch-meta')).every(h => !!h.querySelector('.scratch-drag-handle')));

    startDrag(scratchList, '.scratch-meta', 202);
    const sph = scratchList.querySelector('.scratch-drop-placeholder');
    check('暂存板拖拽插入占位块', !!sph && sph.tagName === 'LI');
    moveTo(scratchList, scratchList.querySelector('[data-id="201"]').getBoundingClientRect().bottom - 3);
    const saves3 = window.__saveCount;
    dropNow(scratchList);
    check('暂存板放下后顺序为 204,203,201,202', ids(scratchList, '.scratch-card') === '204,203,201,202',
        ids(scratchList, '.scratch-card'));
    check('暂存板数据层顺序同步',
        (window.__savedScratch || []).slice().sort((a, b) => a.order - b.order).map(s => s.id).join(',') === '204,203,201,202',
        (window.__savedScratch || []).slice().sort((a, b) => a.order - b.order).map(s => s.id).join(','));
    check('暂存板顺序变化时写了一次存储', window.__saveCount === saves3 + 1, String(window.__saveCount - saves3));
    check('暂存板放下后无占位块/fixed 残留',
        !scratchList.querySelector('.scratch-drop-placeholder') &&
        !Array.from(scratchList.querySelectorAll('.scratch-card')).some(c => c.style.position === 'fixed'));

    // 内容区起拖被忽略
    const sc = scratchList.querySelector('[data-id="203"]');
    const scIds = ids(scratchList, '.scratch-card');
    sc.querySelector('.scratch-content').dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('暂存板正文起拖不触发排序',
        !scratchList.querySelector('.scratch-drop-placeholder') && ids(scratchList, '.scratch-card') === scIds);

    // 编辑暂存内容保持位置
    currentScratchEditId = 203;
    const orderOf203 = myScratchList.find(s => s.id === 203).order;
    scratchModalInput.innerHTML = '改过的便签 C';
    scratchModalSaveBtn.click();
    check('编辑暂存内容后 order 不变',
        myScratchList.find(s => s.id === 203).order === orderOf203,
        orderOf203 + ' → ' + myScratchList.find(s => s.id === 203).order);
    check('编辑暂存内容后位置不变', ids(scratchList, '.scratch-card') === '204,203,201,202',
        ids(scratchList, '.scratch-card'));

    // 新增暂存内容排在最前
    scratchInput.innerHTML = '新便签';
    scratchAddBtn.click();
    check('新增暂存内容出现在最前面',
        scratchList.querySelector('.scratch-card').querySelector('.scratch-content').textContent === '新便签',
        ids(scratchList, '.scratch-card'));

    // 其它入口（右键菜单/background.js）新写入的记录没有 order：应出现在最前面
    myScratchList.push({ id: 999, content: '右键保存的便签', time: Date.now() + 5000 });
    renderScratchList();
    check('无 order 的新记录（右键菜单保存）出现在最前面',
        scratchList.querySelector('.scratch-card').dataset.id === '999',
        ids(scratchList, '.scratch-card'));
    check('补出的 order 不与已有记录冲突',
        new Set(myScratchList.map(s => s.order)).size === myScratchList.length,
        myScratchList.map(s => s.id + ':' + s.order).join(' '));

    log(failed === 0 ? '\n全部用例通过' : '\n失败 ' + failed + ' 项');
    window.__failed = failed;
    window.__done = true;
})();
</script>
</body>
</html>
