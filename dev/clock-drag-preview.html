<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>国际时钟卡片拖拽让位效果预览</title>
<link rel="stylesheet" href="../css/sidepanel.css">
<style>
    body {
        width: 420px;
        margin: 0;
        padding: 12px;
        background: #f8fafc;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #test-log {
        margin-top: 16px;
        padding: 10px;
        background: #0f172a;
        color: #e2e8f0;
        font: 12px/1.7 ui-monospace, Consolas, monospace;
        border-radius: 8px;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div id="view-clock" class="view-content">
    <div class="clock-container">
        <div class="main-clock-card">
            <div class="main-time">--:--:--</div>
        </div>
        <div class="world-clock-list" id="world-clock-list"></div>
    </div>
</div>

<div id="test-log"></div>

<script>
    // 最小 chrome API 垫片 + 存储记录，供 sp-clock.js 在普通网页中运行。
    // Edge/Chrome 自带 window.chrome（但没有 storage），直接赋值会沿用原生对象，
    // 所以这里显式重建 storage 垫片。
    window.__savedClockOrder = null;
    window.chrome = {
        storage: {
            local: {
                get: (keys, cb) => cb && cb({}),
                set: (obj, cb) => {
                    if (obj && obj.meow_world_clock_order) window.__savedClockOrder = obj.meow_world_clock_order;
                    cb && cb();
                }
            },
            sync: { get: (k, cb) => cb && cb({}), set: (o, cb) => cb && cb() },
            onChanged: { addListener: () => {} }
        },
        runtime: { sendMessage: () => {} }
    };
</script>
<script>
    // sp-core.js 在真实环境里声明的全局，这里用最小集替代
    let clockInterval = null;
    const tabBtns = [];
    function initSidepanel() { return Promise.resolve(); }
    const meowI18n = { lang: 'zh-CN', t: (k) => k };
</script>
<script src="../js/modules/sp-clock.js"></script>
<script>
buildClockItems(document.getElementById('world-clock-list'));

(function () {
    const container = document.getElementById('world-clock-list');
    const logEl = document.getElementById('test-log');
    const lines = [];

    function log(text) {
        lines.push(text);
        logEl.textContent = lines.join('\n');
    }

    function check(name, pass, detail) {
        log((pass ? '✅ ' : '❌ ') + name + (detail ? '  → ' + detail : ''));
        if (!pass) window.__failed = (window.__failed || 0) + 1;
    }

    function items() {
        return Array.from(container.querySelectorAll('.clock-item'));
    }

    function zones(all) {
        return items()
            .filter(c => all || c.style.display !== 'none')
            .map(c => c.dataset.zone);
    }

    // ---- 模拟一次拖拽：按真实指针轨迹分步派发 dragover（双列 grid，X/Y 双轴）----
    const dt = new DataTransfer();
    let grabX = 0, grabY = 0;

    function startDrag(zone) {
        const item = container.querySelector('.clock-item[data-zone="' + zone + '"]');
        const handle = item.querySelector('.clock-drag-handle');
        const rect = item.getBoundingClientRect();
        grabX = rect.left + 10;
        grabY = rect.top + 10;
        handle.dispatchEvent(new DragEvent('dragstart', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
    }

    function moveTo(x, y) {
        const steps = Math.max(1, Math.ceil(Math.max(Math.abs(x - grabX), Math.abs(y - grabY)) / 8));
        for (let i = 1; i <= steps; i++) {
            container.dispatchEvent(new DragEvent('dragover', {
                bubbles: true, cancelable: true,
                clientX: grabX + (x - grabX) * i / steps,
                clientY: grabY + (y - grabY) * i / steps,
                dataTransfer: dt
            }));
        }
        grabX = x;
        grabY = y;
    }

    function dropNow() {
        container.dispatchEvent(new DragEvent('drop', {
            bubbles: true, cancelable: true,
            clientX: grabX, clientY: grabY,
            dataTransfer: dt
        }));
        container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    }

    // ===== 用例 0：基础状态 =====
    const initialZones = zones();
    check('只有手柄是拖拽入口，卡片本体不 draggable',
        !items().some(c => c.getAttribute('draggable') === 'true') &&
        Array.from(container.querySelectorAll('.clock-drag-handle')).every(h => h.getAttribute('draggable') === 'true'));
    check('每张卡片都有 grip 手柄', items().every(c => c.querySelector('.clock-drag-handle')));
    check('卡片为双列 grid（2 列）',
        getComputedStyle(container).gridTemplateColumns.split(' ').length === 2);

    // ===== 用例 1：把第一张卡（America/New_York）拖到末尾 =====
    const firstZone = initialZones[0];
    const firstCard = container.querySelector('.clock-item[data-zone="' + firstZone + '"]');
    const beforePositions = new Map();
    items().filter(c => c !== firstCard).forEach(c => {
        beforePositions.set(c.dataset.zone, { top: c.offsetTop, left: c.offsetLeft });
    });

    startDrag(firstZone);

    const ph1 = container.querySelector('.clock-drop-placeholder');
    check('拖拽开始即插入占位块', !!ph1);
    check('占位块紧邻原位置（被拖卡片之前）',
        ph1 && ph1.nextElementSibling && ph1.nextElementSibling.dataset.zone === firstZone);
    check('被拖卡片进入 fixed 跟随',
        container.querySelector('.clock-item[data-zone="' + firstZone + '"]').classList.contains('dragging-follow'));

    // 拖到末尾卡片（SaoPaulo）的右下区域 → 目标格在其后（末尾）
    const lastCard = items().find(c => c.dataset.zone === 'America/Sao_Paulo');
    const lastRect = lastCard.getBoundingClientRect();
    moveTo(lastRect.right - 4, lastRect.bottom - 4);

    const ph2 = container.querySelector('.clock-drop-placeholder');
    check('占位块已移动到末尾', ph2 && !ph2.nextElementSibling,
        'placeholder 后方兄弟：' + (ph2 && ph2.nextElementSibling ? ph2.nextElementSibling.dataset.zone : 'null'));

    // 双列 grid：第一张卡从左上挪到右下末尾，其余 6 张全部让位（行/列位置变化）
    const shifted = items().filter(c => {
        if (c.dataset.zone === firstZone) return false;
        const p = beforePositions.get(c.dataset.zone);
        return c.offsetTop !== p.top || c.offsetLeft !== p.left;
    }).map(c => c.dataset.zone);
    check('其余卡片全部被让位推动（offsetTop/offsetLeft 改变）',
        shifted.length === 6, '改变 ' + shifted.length + ' 张: ' + shifted.join(','));

    const phWidth = ph2 ? parseFloat(ph2.style.width) : 0;
    const dragWidth = container.querySelector('.clock-item[data-zone="' + firstZone + '"]').offsetWidth;
    check('占位块宽度与被拖卡片一致', Math.abs(phWidth - dragWidth) < 1.5,
        phWidth.toFixed(1) + ' vs ' + dragWidth.toFixed(1));

    dropNow();
    const expected = initialZones.slice(1).concat(initialZones[0]);
    check('放下后 DOM 顺序为原序的末位移前',
        zones().join(',') === expected.join(','), zones().join(','));
    check('放下后占位块已移除', !container.querySelector('.clock-drop-placeholder'));
    check('放下后无 fixed 跟随残留',
        !container.querySelector('.dragging-follow') &&
        !items().some(c => c.style.position === 'fixed' || c.style.transform));
    check('放下后索引重排为 0..6',
        items().every((c, i) => c.dataset.index === String(i)));

    const saved1 = window.__savedClockOrder || worldClockOrder;
    check('保存顺序与 DOM 顺序一致', saved1 && saved1.join(',') === expected.join(','),
        saved1 ? saved1.join(',') : 'null');
    check('worldClockOrder 变量已同步', worldClockOrder && worldClockOrder.join(',') === expected.join(','));

    // ===== 用例 2：把末尾卡片往回拖到最前（验证上移方向） =====
    const backZone = expected[expected.length - 1]; // 刚被拖到最后的那张
    startDrag(backZone);
    const firstNow = items()[0].getBoundingClientRect();
    moveTo(firstNow.left + 4, firstNow.top + 4);
    const ph3 = container.querySelector('.clock-drop-placeholder');
    check('回拖时占位块移到最前', ph3 && !ph3.previousElementSibling);
    dropNow();
    check('回拖放下后恢复原顺序', zones().join(',') === initialZones.join(','), zones().join(','));

    // ===== 用例 3：只有手柄起拖；内容区拖拽被忽略 =====
    const timeEl = items()[2].querySelector('.clock-city-time');
    const before3 = zones().join(',');
    timeEl.dispatchEvent(new DragEvent('dragstart', {
        bubbles: true, cancelable: true, clientX: 10, clientY: 10, dataTransfer: new DataTransfer()
    }));
    check('内容区拖拽不触发卡片排序',
        !container.querySelector('.clock-drop-placeholder') && zones().join(',') === before3);

    // ===== 用例 4：拖到区域外松手应取消 =====
    startDrag(initialZones[2]);
    const before4 = zones().join(',');
    const target = items()[5].getBoundingClientRect();
    moveTo(target.right - 4, target.bottom - 4);
    container.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    check('区域外松手恢复原顺序', zones().join(',') === before4, before4 + ' → ' + zones().join(','));
    check('取消后无占位块残留', !container.querySelector('.clock-drop-placeholder'));
    check('取消后不写入存储（仍为上次落位的顺序）',
        window.__savedClockOrder && window.__savedClockOrder.join(',') === initialZones.join(','),
        window.__savedClockOrder ? window.__savedClockOrder.join(',') : 'null');

    window.__done = true;
})();
</script>
</body>
</html>
